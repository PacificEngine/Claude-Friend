<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Virtual Pet</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <ul class="icons" aria-label="Menu">
      <li><button type="button" data-menu="feed" aria-label="Feed" title="Feed">🍙</button></li>
      <li><button type="button" data-menu="light" aria-label="Light" title="Light">💡</button></li>
      <li><button type="button" data-menu="play" aria-label="Play" title="Play">🎮</button></li>
      <li><button type="button" data-menu="medicine" aria-label="Medicine" title="Medicine">💉</button></li>
      <li><button type="button" data-menu="clean" aria-label="Clean" title="Clean">🚽</button></li>
      <li><button type="button" data-menu="status" aria-label="Status" title="Status">📊</button></li>
      <li><button type="button" data-menu="discipline" aria-label="Discipline" title="Discipline">📣</button></li>
    </ul>
    <div class="screen">
      <canvas id="lcd" width="32" height="32" aria-label="Pet screen"></canvas>
    </div>
    <p id="notice" class="notice" role="status" aria-live="polite"></p>
    <div class="buttons">
      <button data-button="A" aria-label="Button A (cycle)">A</button>
      <button data-button="B" aria-label="Button B (select)">B</button>
      <button data-button="C" aria-label="Button C (cancel)">C</button>
    </div>
    <button id="mute" class="mute" aria-pressed="false">Sound: on</button>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
